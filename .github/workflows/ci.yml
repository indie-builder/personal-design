name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable corepack (pnpm 版本由 packageManager 字段锁定)
        run: corepack enable

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - name: Agent environment contracts
        run: pnpm check:navigation && pnpm check:skills

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Isolated chat acceptance
        run: |
          npm install --global portless@0.15.7
          pnpm exec playwright install --with-deps chromium
          pnpm check:chat

      - name: Chat acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chat-acceptance
          path: |
            .impeccable/review/chat-checks/*.log
            .impeccable/review/chat-checks/*.json
            .impeccable/review/chat-checks/*.png
          if-no-files-found: ignore
