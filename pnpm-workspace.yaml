  - packages/*

overrides:
  '@remotion/cli@4.0.535>minimist': 1.2.8
  '@remotion/cli@4.0.535>semver': 7.8.5
  '@remotion/studio@4.0.535>semver': 7.8.5
  '@remotion/studio-server@4.0.535>semver': 7.8.5
  '@remotion/bundler@4.0.535>esbuild': 0.28.2
  'rehype-katex>katex': 0.19.0
  'micromark-extension-math>katex': 0.19.0

allowBuilds:
